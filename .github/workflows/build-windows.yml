name: Build Windows EXE

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained single-file exe (win-x64)
        run: dotnet publish src/StrykerOSS/StrykerOSS.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish

      - name: Prepare artifacts
        shell: pwsh
        run: |
          Copy-Item publish/StrykerOSS.exe StrykerOSS-portable.exe
          Get-Item StrykerOSS-portable.exe | Select-Object Name,Length

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/StrykerOSS.iss /DAppVersion=1.1.0
          Get-ChildItem installer/Output

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StrykerOSS-windows
          path: |
            StrykerOSS-portable.exe
            installer/Output/StrykerOSS-Setup-1.1.0.exe
          if-no-files-found: error

      - name: Create release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" --title "StrykerOSS $env:GITHUB_REF_NAME" --notes "Build Windows de StrykerOSS (usage educatif uniquement). Exe portable + installeur." StrykerOSS-portable.exe installer/Output/StrykerOSS-Setup-1.1.0.exe
